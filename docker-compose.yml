version: '3.8'

services:
  # ─────────────────────────────────────────────
  # FastAPI Backend  →  http://localhost:8100
  # ─────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: ai-devops-backend
    ports:
      - "8100:8000"
    environment:
      - PROMETHEUS_URL=http://prometheus:9090
      - OLLAMA_HOST=http://host.docker.internal:11434
      - SLACK_TOKEN=${SLACK_TOKEN:-}
    volumes:
      - ./reports:/app/reports
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - ai-devops-net

  # ─────────────────────────────────────────────
  # React Frontend  →  http://localhost:4300
  # ─────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: ai-devops-frontend
    ports:
      - "4300:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ai-devops-net

  # ─────────────────────────────────────────────
  # Prometheus  →  http://localhost:9095
  # ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: ai-devops-prometheus
    ports:
      - "9095:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    restart: unless-stopped
    networks:
      - ai-devops-net

  # ─────────────────────────────────────────────
  # Grafana  →  http://localhost:3100
  # ─────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: ai-devops-grafana
    ports:
      - "3100:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=devops123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - ai-devops-net

volumes:
  prometheus_data:
  grafana_data:

networks:
  ai-devops-net:
    driver: bridge
